<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastrar - CaixaComanda</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/demo.css" />
</head>
<body class="main">
  <main role="main" class="main-conteudo">
    <div class="fornecedor-form" id="conteudo"></div>
  </main>

  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/store.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/form-produto.js"></script>
  <script>
    /* Views/Fornecedor/Cadastrar.cshtml + FornecedorController.Cadastrar */
    montarLayout("Cadastrar");

    const form = montarFormProduto(document.getElementById("conteudo"), null);

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      // Sem foto, Foto fica vazio e a listagem cai na imagem alternativa.
      // (O controller original estoura se nenhum arquivo for enviado.)
      store.cadastrarProduto(lerFormProduto(form));
      location.href = "/fornecedor/";
    });
  </script>
</body>
</html>
