<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastre-se - CaixaComanda</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/demo.css" />
</head>
<body class="main">
  <main role="main" class="main-conteudo">
    <div class="login">
      <form class="login-form" id="cadastrar">
        <div class="login-form__grupo">
          <label for="txtEmail">E-mail:</label>
          <input placeholder="Digite aqui seu e-mail..." type="email" id="txtEmail" name="txtEmail"
                 autocomplete="username" required />
        </div>

        <div class="login-form__grupo">
          <label for="txtSenha">Senha:</label>
          <input placeholder="Digite aqui sua senha..." type="password" id="txtSenha" name="txtSenha"
                 autocomplete="new-password" required />
        </div>

        <div class="login-form__grupo">
          <label for="txtConfirmarSenha">Confirmar a Senha:</label>
          <input placeholder="Digite sua senha novamente..." type="password" id="txtConfirmarSenha"
                 name="txtConfirmarSenha" autocomplete="new-password" required />
        </div>

        <div class="login-form__grupo">
          <button class="login-form__submit" type="submit" name="btnSubmit">Cadastrar</button>

          <a class="login-form__link" href="/login/login.html">Já tem um cadastro?</a>
        </div>

        <p class="erro-demo" id="erro" hidden></p>
      </form>
    </div>
  </main>

  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/store.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
    /* Views/Login/Cadastrar.cshtml + LoginController.Cadastrar */
    montarLayout("Cadastre-se");

    document.getElementById("cadastrar").addEventListener("submit", function (e) {
      e.preventDefault();

      if (this.txtSenha.value !== this.txtConfirmarSenha.value) {
        mostrarErro("As senhas estão diferentes.");
        return;
      }

      // O controller só manda Email, Senha e Tipo; o Tipo é sempre "A" (ver store.js),
      // então toda conta criada aqui entra como fornecedor/administrador.
      const id = store.cadastrarUsuario({
        Email: this.txtEmail.value,
        Senha: this.txtSenha.value,
      });

      if (!id) {
        mostrarErro("Já existe uma conta com esse e-mail.");
        return;
      }

      // Cadastro bem-sucedido devolve a tela de Login, como no original.
      location.href = "/login/login.html";
    });
  </script>
</body>
</html>
